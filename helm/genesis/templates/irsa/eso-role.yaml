apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: external-secrets-controller
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "41"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: external-secrets-operator
  description: Grants external secrets operator access to manage secrets in SecretsManager
  assumeRolePolicyDocument: |
    {{- include "assumeRoleDocument"
      (dict
        "Values" .Values
        "serviceAccountNamespace" "ack-system"
        "serviceAccountName" "ack-iam-controller"
      )
    | indent 4 }}
  inlinePolicies:
    readOnlySecretAccess: |
      {
        "Version":"2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "secretsmanager:ListSecrets",
              "secretsmanager:BatchGetSecretValue"
            ],
            "Resource": "*"
          },
          {
            "Effect": "Allow",
            "Action": [
              "secretsmanager:GetResourcePolicy",
              "secretsmanager:GetSecretValue",
              "secretsmanager:DescribeSecret",
              "secretsmanager:ListSecretVersionIds"
            ],
            "Resource": [
              "arn:aws:secretsmanager:{{ .Values.aws.region }}:{{ .Values.aws.accountId }}:secret:homelab/*"
            ]
          }
        ]
      }
    