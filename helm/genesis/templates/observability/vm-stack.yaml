apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "41"
    argocd.argoproj.io/ignore-healthcheck: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    chart: victoria-metrics-k8s-stack
    repoURL: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
    targetRevision: 0.86.0
    helm:
      valuesObject:
        victoria-metrics-operator:
          enabled: false
        # NOTE: Metrics Configuration
        vmsingle:
          spec:
            removePvcAfterDelete: true
            nodeSelector:
              node.niovial.io/pool: database
            tolerations:
              - key: node.niovial.io/pool
                operator: Equal
                value: database
        prometheus-node-exporter:
          namespaceOverride: observability-agents
        # NOTE: Logs Configuration
        vlsingle:
          enabled: true
          spec:
            removePvcAfterDelete: true
            nodeSelector:
              node.niovial.io/pool: database
            tolerations:
              - key: node.niovial.io/pool
                operator: Equal
                value: database
        vlagent:
          enabled: true
          namespaceOverride: observability-agents
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - kind: Secret
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true