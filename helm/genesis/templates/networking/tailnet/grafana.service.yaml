apiVersion: v1
kind: Service
metadata:
  name: ts-grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "42"
    tailscale.com/hostname: grafana
    tailscale.com/proxy-group: internal-gateway
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000