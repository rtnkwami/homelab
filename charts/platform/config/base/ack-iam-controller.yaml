aws:
  region: us-east-1
deployment:
  replicas: 3
  nodeSelector:
    node.niovial.io/pool: system
  tolerations:
    - key: node.niovial.io/pool
      operator: Equal
      value: system
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: ack-iam-controller
leaderElection:
  enabled: true