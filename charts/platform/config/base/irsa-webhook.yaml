replicaCount: 3
podDisruptionBudget:
  enabled: true
  minAvailable: 1
nodeSelector:
  node.niovial.io/pool: system
tolerations:
  - key: node.niovial.io/pool
    operator: Equal
    value: system
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: topology.kubernetes.io/zone
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: irsa-webhook