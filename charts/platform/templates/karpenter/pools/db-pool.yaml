apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: database
spec:
  template:
    metadata:
      labels:
        node.niovial.io/pool: database
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: database
      taints:
        - key: node.niovial.io/pool
          value: system
          effect: NoSchedule
      requirements:
        - key: "eks.amazonaws.com/instance-category"
          operator: In
          values: ["c", "m", "r"]
        
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
    budgets:
      - nodes: 10%