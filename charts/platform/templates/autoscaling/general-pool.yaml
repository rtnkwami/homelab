{{- if (eq .Values.provider "aws") }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
spec:
  template:
    metadata:
      labels:
        node.niovial.io/pool: general
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m", "r"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
{{- end }}