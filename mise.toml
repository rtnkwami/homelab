monorepo_root = true

[monorepo]
config_roots = [
  "apps/*",
  "packages/*"
]

[settings]
task.source_freshness_hash_contents = true
task.run_auto_install = true
task.cache_dir = ".mise/cache"
experimental = true

[tools]
node = "26"
"npm:pnpm" = "11.24.0"
opentofu = "1.12"
helm = "4.2.4"
kubectl = "1.36.1"

[tasks."tofu:cache"]
run = "mkdir -p .tofu/cache"

[env]
TF_PLUGIN_CACHE_DIR = "{{ config_root }}/.tofu/cache"
KUBECONFIG = "{{ config_root }}/infra/cluster/out/kubeconfig"

# homelab k8s cluster tasks
[tasks."homelab:init"]
depends = "tofu:cache"
dir = "infra/cluster"
run = "tofu init -upgrade"

[tasks."homelab:preview"]
dir = "infra/cluster"
run = """
  mkdir -p out
  tofu plan -out=out/cluster.tfplan
"""

[tasks."homelab:deploy"]
depends = "homelab:preview"
dir = "infra/cluster"
run = "tofu apply out/cluster.tfplan"

[tasks."homelab:bootstrap"]
run = """
  helm install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
   --version 0.61.0 \
   --namespace flux-system \
   --create-namespace \
   --rollback-on-failure \
   --disable-openapi-validation
"""

[tasks."homelab:reset"]
run = """
  kubectl delete \
    -f gitops/flux-instance.yaml \
    --ignore-not-found \
    --timeout 10m 
  
  helm uninstall flux-operator -n flux-system --ignore-not-found
"""

[tasks."homelab:destroy"]
depends = "homelab:reset"
dir = "infra/cluster"
run = "tofu destroy --auto-approve"

[tasks."homelab:images:create"]
dir = "infra/images"
run = """
  tofu init
  tofu apply --auto-approve
"""

[tasks."homelab:images:remove"]
dir = "infra/images"
run = """
  tofu init
  tofu destroy --auto-approve
"""
