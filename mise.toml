monorepo_root = true

[monorepo]
config_roots = [
  "apps/*",
  "packages/*"
]

[settings]
task.source_freshness_hash_contents = true
task.run_auto_install = true
task.cache_dir = ".mise/cache"
experimental = true

[tools]
node = "26"
"npm:pnpm" = "11.24.0"
opentofu = "1.12"
helm = "4.2.4"
kubectl = "1.36.1"

[tasks."tofu:cache"]
run = "mkdir -p .tofu/cache"

[env]
TF_PLUGIN_CACHE_DIR = "{{ config_root }}/.tofu/cache"

[tasks."eks:init"]
depends = "tofu:cache"
dir = "infra/k8s/eks"
run = "tofu init -upgrade"

[tasks."talos:init"]
depends = "tofu:cache"
dir = "infra/k8s/talos"
run = "tofu init -upgrade"

[tasks."eks:preview"]
dir = "infra/k8s/eks"
run = """
  mkdir -p .config
  tofu plan -out=.config/cluster.tfplan
"""

[tasks."talos:preview"]
dir = "infra/k8s/talos"
run = """
  mkdir -p .config
  tofu plan -out=.config/cluster.tfplan
"""

[tasks."eks:deploy"]
depends = "eks:preview"
dir = "infra/k8s/eks"
run = "tofu apply .config/cluster.tfplan"

[tasks."talos:deploy"]
depends = "talos:preview"
dir = "infra/k8s/talos"
run = "tofu apply .config/cluster.tfplan"

[tasks."eks:bootstrap"]
env = { KUBECONFIG = "{{ config_root }}/infra/k8s/eks/.config/kubeconfig" }
run = """
  helm install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
   --version 0.61.0 \
   --namespace flux-system \
   --create-namespace \
   --rollback-on-failure \
   --set tolerations[0].key=CriticalAddonsOnly \
   --set tolerations[0].operator=Exists \
   --set tolerations[1].key=node.niovial.io/pool \
   --set tolerations[1].operator=Equal \
   --set tolerations[1].value=system
"""

[tasks."eks:reset"]
env = { KUBECONFIG = "{{ config_root }}/infra/k8s/eks/.config/kubeconfig" }
run = """
  kubectl delete -f gitops/eks/bootstrap \
    --ignore-not-found \
    --timeout 10m 
"""

[tasks."talos:reset"]
env = { KUBECONFIG = "{{ config_root }}/infra/k8s/talos/.config/kubeconfig" }
run = """
  kubectl delete -f gitops/talos/bootstrap \
    --ignore-not-found \
    --timeout 10m 
"""

[tasks."eks:destroy"]
depends = "eks:reset"
dir = "infra/k8s/eks"
run = "tofu destroy --auto-approve"

[tasks."talos:destroy"]
depends = "talos:reset"
dir = "infra/k8s/talos"
run = "tofu destroy --auto-approve"
