apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: istio
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: gateway-api-crds
      namespace: flux-system
      ready: true
  steps:
    - name: istio-repository
      resources:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: istio-system
            labels:
              pod-security.kubernetes.io/enforce: privileged
            annotations:
              fluxcd.controlplane.io/prune: disabled

        - apiVersion: source.toolkit.fluxcd.io/v1
          kind: HelmRepository
          metadata:
            name: istio
            namespace: istio-system
          spec:
            interval: 30m
            url: https://blob.istio.io/istio-release/charts

    - name: base
      resources:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: istio-base
            namespace: istio-system
          spec:
            releaseName: istio-base
            interval: 3m
            driftDetection:
              mode: enabled
            chart:
              spec:
                chart: base
                version: "1.31.x"
                sourceRef:
                  kind: HelmRepository
                  name: istio
                interval: 15m
            values:
              base:
                validationFailurePolicy: Fail
  
    - name: istiod
      resources:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: istiod
            namespace: istio-system
          spec:
            releaseName: istiod
            interval: 3m
            driftDetection:
              mode: enabled
              ignore:
                - target:
                    kind: ValidatingWebhookConfiguration
                    name: istio-validator-istio-system
                  paths:
                    - /webhooks/0/clientConfig/caBundle
                    - /webhooks/0/failurePolicy
            chart:
              spec:
                chart: istiod
                version: "1.31.x"
                sourceRef:
                  kind: HelmRepository
                  name: istio
                interval: 15m
            values:
              profile: ambient
              autoscaleMin: 2
              autoscaleMax: 6
              cpu:
                targetAverageUtilization: 80
              memory:
                targetAverageUtilization: 70
              resources:
                requests:
                  cpu: 256m
                  memory: 500Mi
              nodeSelector:
                node.niovial.io/pool: system
              tolerations:
                - key: node.niovial.io/pool
                  operator: Equal
                  value: system
              topologySpreadConstraints:
                - topologyKey: "topology.kubernetes.io/zone"
                  maxSkew: 1
                  minDomains: 2
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: istiod
                  matchLabelKeys: ["pod-template-hash"]
    
    - name: cni
      resources:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: istio-cni
            namespace: istio-system
          spec:
            releaseName: istio-cni
            interval: 3m
            driftDetection:
              mode: enabled
            chart:
              spec:
                chart: cni
                version: "1.31.x"
                sourceRef:
                  kind: HelmRepository
                  name: istio
                interval: 15m
            values:
              profile: ambient

    - name: ztunnel
      resources:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: ztunnel
            namespace: istio-system
          spec:
            releaseName: ztunnel
            interval: 3m
            driftDetection:
              mode: enabled
            chart:
              spec:
                chart: ztunnel
                version: "1.31.x"
                sourceRef:
                  kind: HelmRepository
                  name: istio
                interval: 15m

