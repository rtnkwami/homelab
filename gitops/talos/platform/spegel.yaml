apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: spegel
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: spegel
        labels:
          pod-security.kubernetes.io/enforce: privileged
        annotations:
          fluxcd.controlplane.io/prune: disabled

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: spegel
        namespace: spegel
      spec:
        interval: 30m
        type: "oci"
        url: oci://ghcr.io/spegel-org/helm-charts
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: spegel
        namespace: spegel
      spec:
        releaseName: spegel
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: spegel
            version: "0.7.x"
            sourceRef:
              kind: HelmRepository
              name: spegel
            interval: 15m
        values:
          spegel:
            containerdRegistryConfigPath: /etc/cri/conf.d/hosts