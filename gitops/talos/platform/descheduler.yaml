apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: descheduler
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-metrics-server
      namespace: kube-system
      ready: true
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: descheduler
        namespace: kube-system
      spec:
        interval: 30m
        url: https://kubernetes-sigs.github.io/descheduler

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: descheduler
        namespace: kube-system
      spec:
        releaseName: descheduler
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: descheduler
            version: "0.36.x"
            sourceRef:
              kind: HelmRepository
              name: descheduler
            interval: 15m
        values:
          kind: Deployment
          leaderElection:
            enabled: true
          podDisruptionBudget:
            enabled: true
          nodeSelector:
            node.niovial.io/pool: system
          tolerations:
            - key: node.niovial.io/pool
              operator: Equal
              value: system
          replicas: 3
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              minDomains: 3
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: descheduler
              matchLabelKeys: ["pod-template-hash"]
          deschedulingInterval: 3m
          # https://github.com/kubernetes-sigs/descheduler/blob/master/README.md
          deschedulerPolicy:
            maxNoOfPodsToEvictPerNode: 10
            maxNoOfPodsToEvictPerNamespace: 10
            # use metrics server as metrics provider
            metricsProviders:
              - source: KubernetesMetrics
            profiles:
              - name: default
                plugins:
                  balance:
                    enabled:
                      - LowNodeUtilization
                pluginConfig:
                  - name: DefaultEvictor
                    args:
                      nodeFit: true
                      minReplicas: 2
                      podProtections:
                        defaultDisabled:
                          - "PodsWithLocalStorage"
                        extraEnabled:
                          - "PodsWithPVC"

                  - name: LowNodeUtilization
                    args:
                      metricsUtilization:
                        source: KubernetesMetrics
                      thresholds: { memory: 35 }
                
