apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: app-gateway
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
      ready: true

    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: homelab-secrets
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: shared-inputs
  steps:
    - name: cert-manager-dns-secret
      resources:
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: cloudflare-dns-token
            namespace: cert-manager
          spec:
            secretStoreRef:
              name: homelab-secrets
              kind: ClusterSecretStore
            refreshPolicy: Periodic
            refreshInterval: 24h
            data:
              - secretKey: dns-token
                remoteRef:
                  key: homelab/cloudflare-dns
                  property: niovial.io

    - name: cluster-issuer
      resources:
        - apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-<< inputs.letsEncrypt.environment >>
          spec:
            acme:
              email: << inputs.letsEncrypt.email >>
              server: << if eq inputs.letsEncrypt.environment "staging" >>https://acme-staging-v02.api.letsencrypt.org/directory<< else >>https://acme-v02.api.letsencrypt.org/directory<< end >>
              privateKeySecretRef:
                name: letsencrypt-<< inputs.letsEncrypt.environment >>
              solvers:
                - dns01:
                    cloudflare:
                      apiTokenSecretRef:
                        name: cloudflare-dns-token
                        key: dns-token

    - name: gateway-config
      resources:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-system
            labels:
              istio.io/dataplane-mode: ambient
            annotations:
              fluxcd.controlplane.io/prune: disabled

        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: app-gateway-cm
            namespace: gateway-system
          data:
            horizontalPodAutoscaler: |
              spec:
                minReplicas: 2
                maxReplicas: 6
                metrics:
                  - type: Resource
                    resource:
                      name: cpu
                      target:
                        type: Utilization
                        averageUtilization: 50
                      
            deployment: |
              spec:
                template:
                  metadata:
                    annotations:
                      proxy.istio.io/config: '{"gatewayTopology" : { "proxyProtocol": {} }}'
                  spec:
                    topologySpreadConstraints:
                      - topologyKey: "topology.kubernetes.io/zone"
                        maxSkew: 1
                        minDomains: 2
                        whenUnsatisfiable: DoNotSchedule
                        labelSelector:
                          matchLabels:
                            gateway.networking.k8s.io/gateway-name: app-gateway
                        matchLabelKeys: ["pod-template-hash"]

    - name: app-gateway
      resources:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: app-gateway
            namespace: gateway-system
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-<< inputs.letsEncrypt.environment >>
          spec:
            gatewayClassName: istio
            infrastructure:
              parametersRef:
                group: ""
                kind: ConfigMap
                name: app-gateway-cm
              annotations:
                load-balancer.hetzner.cloud/name: "app-gateway"
                load-balancer.hetzner.cloud/location: "nbg1"
            listeners:
              - name: https
                hostname: "*.niovial.io"
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  mode: Terminate
                  certificateRefs:
                    - name: niovial-io-tls