apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: autoscaling
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: karpenter
      namespace: kube-system
      ready: true
  steps:
    - name: node-class
      resources:
        - apiVersion: karpenter.hetzner.cloud/v1
          kind: HCloudNodeClass
          metadata:
            name: default
          spec:
            locations:
              - nbg1
              - fsn1
              - hel1
            imageSelector:
              family: talos
              selector:
                os: ${talosSnapshot}
            networkID: ${networkId}
            sshKeyIDs: 
             - ${sshKeyId}
            firewallIDs:
              - ${firewallId}
            userDataSecretRef:
              namespace: kube-system
              name: talos-worker-machineconfig
              key: worker.yaml
    
    - name: nodepools
      resources:
        - apiVersion: karpenter.sh/v1
          kind: NodePool
          metadata:
            name: general
          spec:
            disruption:
              consolidationPolicy: WhenEmpty
              consolidateAfter: 30s
              budgets:
                - nodes: 10%
            template:
              metadata:
                labels:
                  node.niovial.io/pool: general
              spec:
                nodeClassRef:
                  group: karpenter.hetzner.cloud
                  kind: HCloudNodeClass
                  name: default
                requirements:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: [on-demand]
                  
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]

                  - key: karpenter.hetzner.cloud/server-family
                    operator: In
                    values: [cx, cpx]
                  
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: [nbg1, fsn1, hel1]
        
        - apiVersion: karpenter.sh/v1
          kind: NodePool
          metadata:
            name: critical
          spec:
            disruption:
              consolidationPolicy: WhenEmpty
              consolidateAfter: 30s
              budgets:
                - nodes: 10%
            template:
              metadata:
                labels:
                  node.niovial.io/pool: system
              spec:
                nodeClassRef:
                  group: karpenter.hetzner.cloud
                  kind: HCloudNodeClass
                  name: default
                taints:
                  - key: node.niovial.io/pool
                    value: system
                    effect: NoSchedule
                requirements:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: [on-demand]
                  
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]

                  - key: karpenter.hetzner.cloud/server-family
                    operator: In
                    values: [cx, cpx]

                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: [nbg1, fsn1, hel1]
