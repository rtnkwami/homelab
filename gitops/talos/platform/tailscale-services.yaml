apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: tailscale-services
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  dependsOn:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: tailscale-gateway
      namespace: gateway-system
      ready: true
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns
      namespace: external-dns
      ready: true
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: observability
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
      spec:
        parentRefs:
          - name: tailscale-gateway
            namespace: gateway-system
        hostnames:
          - "grafana.internal.niovial.io"
        rules:
          - backendRefs:
            - name: vm-stack-grafana
              port: 80
    
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: flux-web-ui
        namespace: flux-system
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
      spec:
        parentRefs:
          - name: tailscale-gateway
            namespace: gateway-system
        hostnames:
          - "fluxcd.internal.niovial.io"
        rules:
          - backendRefs:
            - name: flux-operator
              port: 9080