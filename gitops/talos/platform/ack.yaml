apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: aws-controllers-k8s
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: amazon-eks-pod-identity-webhook
      namespace: kube-system
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: shared-inputs
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: ack-system
        annotations:
          fluxcd.controlplane.io/prune: disabled

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: aws-controllers-k8s
        namespace: ack-system
      spec:
        interval: 30m
        type: "oci"
        url: oci://public.ecr.aws/aws-controllers-k8s
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: ack-iam-controller
        namespace: ack-system
      spec:
        releaseName: ack-iam-controller
        interval: 3m
        driftDetection:
          mode: enabled
        install:
          crds: CreateReplace
        upgrade:
          crds: CreateReplace
        chart:
          spec:
            chart: iam-chart
            version: "1.9.x"
            sourceRef:
              kind: HelmRepository
              name: aws-controllers-k8s
            interval: 15m
        values:
          aws:
            region: us-east-1
          deployment:
            replicas: 3
            nodeSelector:
              node.niovial.io/pool: system
            tolerations:
              - key: node.niovial.io/pool
                operator: Equal
                value: system
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: topology.kubernetes.io/zone
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: ack-iam-controller
          leaderElection:
            enabled: true
          featureGates:
            IAMRoleSelector: true
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::<< inputs.accountId >>:role/AwsControllersK8sRole