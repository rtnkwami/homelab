apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: karpenter
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: shared-inputs
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: karpenter-provider-hetzner
        namespace: kube-system
      spec:
        interval: 30m
        type: "oci"
        url: oci://ghcr.io/stubbi/charts

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: karpenter
        namespace: kube-system
      spec:
        releaseName: karpenter
        interval: 3m
        driftDetection:
          mode: enabled
        install:
          crds: CreateReplace
        upgrade:
          crds: CreateReplace
        chart:
          spec:
            chart: karpenter-provider-hetzner
            version: "3.0.x"
            sourceRef:
              kind: HelmRepository
              name: karpenter-provider-hetzner
            interval: 15m
        values:
          clusterName: << inputs.clusterName >>
          auth:
            secretRef:
              name: hcloud-token
          replicas: 3
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              minDomains: 3
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: karpenter
              matchLabelKeys: ["pod-template-hash"]