apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: ack-role-selectors
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ack-iam-controller
      namespace: ack-system
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: shared-inputs
  resources:
    - apiVersion: services.k8s.aws/v1alpha1
      kind: IAMRoleSelector
      metadata:
        name: ack-iam-selector
      spec:
        # See infra/k8s/talos/irsa.config.tf
        arn: arn:aws:iam::<< inputs.accountId >>:role/IAMRoleCreator
        namespaceSelector:
          names:
            - external-secrets
