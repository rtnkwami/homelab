apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: shared-inputs
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  type: Static
  defaultValues:
    accountId: "913509421780"
    region: us-east-1
    
    clusterName: homelab

    clusterOIDC: s3.us-east-1.amazonaws.com/niovial-homelab-oidc
    
    letsEncrypt:
      environment: staging
      email: cert-alerts@niovial.io
