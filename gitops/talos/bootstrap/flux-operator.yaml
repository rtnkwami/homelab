apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flux-operator
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      name: flux
      ready: true
  commonMetadata:
    annotations:
      fluxcd.controlplane.io/prune: disabled
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: flux-operator
        namespace: flux-system
      spec:
        interval: 30m
        type: "oci"
        url: oci://ghcr.io/controlplaneio-fluxcd/charts/
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: flux-operator
        namespace: flux-system
      spec:
        releaseName: flux-operator
        targetNamespace: flux-system
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: flux-operator
            version: "0.61.x"
            sourceRef:
              kind: HelmRepository
              name: flux-operator
            interval: 15m
        values:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists