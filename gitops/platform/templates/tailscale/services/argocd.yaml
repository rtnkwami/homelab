apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-tailnet
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "52"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: tailnet-gateway
      namespace: gateway-system
  hostnames: 
    - "argocd.internal.niovial.io"
  rules:
    - backendRefs:
      - name: argocd-server
        port: 80