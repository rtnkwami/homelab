{{- if .Values.certManager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/ignore-healthcheck: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    targetRevision: 1.20.2
    helm:
      valuesObject:
        global:
          {{- include "operatorNodeSelectors" . | indent 10 }}
        {{- include "operatorTolerations" . | indent 8 }}
        replicaCount: 3
        podDisruptionBudget:
          enabled: true
        crds:
          enabled: true
        config:
          enableGatewayAPI: true
        topologySpreadConstraints:
          - topologyKey: "topology.kubernetes.io/zone"
            maxSkew: 1
            minDomains: 3
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cert-manager
                app.kubernetes.io/instance: cert-manager
            matchLabelKeys: ["pod-template-hash"]
        webhook:
          replicaCount: 3
          podDisruptionBudget:
            enabled: true
          {{- include "operatorTolerations" . | indent 10 }}
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              minDomains: 3
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: webhook
                  app.kubernetes.io/instance: cert-manager
              matchLabelKeys: ["pod-template-hash"]
        cainjector:
          replicaCount: 3
          podDisruptionBudget:
            enabled: true
          {{- include "operatorTolerations" . | indent 10 }}
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              minDomains: 3
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cainjector
                  app.kubernetes.io/instance: cert-manager
              matchLabelKeys: ["pod-template-hash"]
        startupapicheck:
          {{- include "operatorTolerations" . | indent 10 }}
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
{{- end}}
