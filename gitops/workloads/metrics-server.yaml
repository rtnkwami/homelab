apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kube-metrics-server
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  dependsOn:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: helmreleases.helm.toolkit.fluxcd.io

    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: autoscaling
      namespace: flux-system
      ready: true 
    
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: flux-operator
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: kube-metrics-server
        namespace: flux-system
      spec:
        interval: 30m
        url: https://kubernetes-sigs.github.io/metrics-server
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-metrics-server
        namespace: flux-system
      spec:
        releaseName: kube-metrics-server
        targetNamespace: kube-system
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: metrics-server
            version: "3.14.x"
            sourceRef:
              kind: HelmRepository
              name: kube-metrics-server
            interval: 15m
        values:
          nodeSelector:
            node.niovial.io/pool: system
          tolerations:
            - key: node.niovial.io/pool
              operator: Equal
              value: system
          replicas: 3
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              minDomains: 3
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: kube-metrics-server
              matchLabelKeys: ["pod-template-hash"]