apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flux-operator
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  commonMetadata:
    annotations:
      fluxcd.controlplane.io/prune: disabled
  dependsOn:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: helmreleases.helm.toolkit.fluxcd.io
      ready: true
    
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: autoscaling
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: flux-operator
        namespace: flux-system
      spec:
        interval: 30m
        type: "oci"
        url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: flux-operator
        namespace: flux-system
      spec:
        releaseName: flux-operator
        targetNamespace: flux-system
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: flux-operator
            version: "0.61.x"
            sourceRef:
              kind: HelmRepository
              name: flux-operator
            interval: 15m
        values:
          nodeSelector:
            node.niovial.io/pool: system
          tolerations:
            - key: node.niovial.io/pool
              operator: Equal
              value: system