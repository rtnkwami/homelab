apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-dns
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  dependsOn:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: homelab-secrets
      ready: true
  steps:
    - name: cloudflare-dns-token
      resources:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: external-dns
            annotations:
              fluxcd.controlplane.io/prune: disabled

        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: cloudflare-dns-token
            namespace: external-dns
          spec:
            secretStoreRef:
              name: homelab-secrets
              kind: ClusterSecretStore
            refreshPolicy: Periodic
            refreshInterval: 24h
            data:
              - secretKey: dns-token
                remoteRef:
                  key: homelab/cloudflare-dns
                  property: niovial.io
    
    - name: external-dns
      resources:
        - apiVersion: source.toolkit.fluxcd.io/v1
          kind: HelmRepository
          metadata:
            name: external-dns
            namespace: external-dns
          spec:
            interval: 30m
            url: https://kubernetes-sigs.github.io/external-dns/
        
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: external-dns
            namespace: external-dns
          spec:
            releaseName: external-dns
            interval: 3m
            driftDetection:
              mode: enabled
            chart:
              spec:
                chart: external-dns
                version: "1.21.x"
                sourceRef:
                  kind: HelmRepository
                  name: external-dns
                interval: 15m
            values:
              nodeSelector:
                node.niovial.io/pool: system
              tolerations:
                - key: node.niovial.io/pool
                  operator: Equal
                  value: system
              triggerLoopOnEvent: true
              sources:
                - service
                - gateway-httproute
                - gateway-tlsroute
                - gateway-tcproute
              rbac:
                additionalPermissions:
                  - apiGroups: [""]
                    resources: ["namespaces"]
                    verbs: ["get","watch","list"]
              provider:
                name: cloudflare
              env:
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-dns-token
                      key: dns-token
              txtOwnerId: homelab
              extraArgs:
                cloudflare-proxied: true