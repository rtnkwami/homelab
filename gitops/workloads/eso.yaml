apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-secrets
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  wait: true
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: external-secrets

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: external-secrets
        namespace: flux-system
      spec:
        interval: 30m
        url: https://charts.external-secrets.io

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-secrets
        namespace: flux-system
      spec:
        releaseName: external-secrets
        targetNamespace: flux-system
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: external-secrets
            version: "2.10.x"
            sourceRef:
              kind: HelmRepository
              name: external-secrets
            interval: 15m
        values:
          global:
            nodeSelector:
              node.niovial.io/pool: system
            tolerations:
              - key: node.niovial.io/pool
                operator: Equal
                value: system
            topologySpreadConstraints:
              - topologyKey: "topology.kubernetes.io/zone"
                maxSkew: 1
                minDomains: 3
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: external-secrets
                matchLabelKeys: ["pod-template-hash"]
          replicaCount: 3
          leaderElect: true
          podDisruptionBudget:
            enabled: true
          webhook:
            replicaCount: 3
            podDisruptionBudget:
              enabled: true
          certController:
            replicaCount: 3
            podDisruptionBudget:
              enabled: true
          