apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cert-manager
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: gateway-api-crds
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager
        annotations:
          fluxcd.controlplane.io/prune: disabled

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: cert-manager
        namespace: flux-system
      spec:
        interval: 30m
        type: "oci"
        url: oci://quay.io/jetstack/charts
    
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: cert-manager
        namespace: flux-system
      spec:
        releaseName: cert-manager
        targetNamespace: cert-manager
        interval: 3m
        driftDetection:
          mode: enabled
        chart:
          spec:
            chart: cert-manager
            version: "1.20.x"
            sourceRef:
              kind: HelmRepository
              name: cert-manager
            interval: 15m
        values:
          global:
            nodeSelector:
              node.niovial.io/pool: system
          tolerations:
            - key: node.niovial.io/pool
              operator: Equal
              value: system
          replicaCount: 3
          podDisruptionBudget:
            enabled: true
          crds:
            enabled: true
          config:
            enableGatewayAPI: true
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              minDomains: 3
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/instance: cert-manager
              matchLabelKeys: ["pod-template-hash"]
          webhook:
            replicaCount: 3
            podDisruptionBudget:
              enabled: true
            tolerations:
            - key: node.niovial.io/pool
              operator: Equal
              value: system
            topologySpreadConstraints:
              - topologyKey: "topology.kubernetes.io/zone"
                maxSkew: 1
                minDomains: 3
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: webhook
                    app.kubernetes.io/instance: cert-manager
                matchLabelKeys: ["pod-template-hash"]
          cainjector:
            replicaCount: 3
            podDisruptionBudget:
              enabled: true
            tolerations:
            - key: node.niovial.io/pool
              operator: Equal
              value: system
            topologySpreadConstraints:
              - topologyKey: "topology.kubernetes.io/zone"
                maxSkew: 1
                minDomains: 3
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cainjector
                    app.kubernetes.io/instance: cert-manager
                matchLabelKeys: ["pod-template-hash"]
          startupapicheck:
            tolerations:
              - key: node.niovial.io/pool
                operator: Equal
                value: system