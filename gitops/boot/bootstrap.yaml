apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: bootstrap
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 3m
spec:
  steps:
    - name: fluxcd
      resources:
        - apiVersion: fluxcd.controlplane.io/v1
          kind: FluxInstance
          metadata:
            name: flux
            namespace: flux-system
            annotations:
              fluxcd.controlplane.io/prune: disabled
              kustomize.toolkit.fluxcd.io/prune: disabled
          spec:
            distribution:
              version: "2.9.x"
              registry: "ghcr.io/fluxcd"
            components:
              - source-controller
              - kustomize-controller
              - helm-controller
            cluster:
              type: kubernetes
              size: medium
    
    - name: bootstrap
      resources:
        - apiVersion: source.toolkit.fluxcd.io/v1
          kind: GitRepository
          metadata:
            name: homelab
            namespace: flux-system
          spec:
            interval: 30m
            url: https://github.com/rtnkwami/homelab.git
            ref:
              branch: refactor/gitops

        - apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata:
            name: bootstrap
            namespace: flux-system
          spec:
            interval: 3m
            sourceRef:
              kind: GitRepository
              name: homelab
              namespace: flux-system
            path: gitops
            prune: true
            deletionPolicy: WaitForTermination
            timeout: 12m
